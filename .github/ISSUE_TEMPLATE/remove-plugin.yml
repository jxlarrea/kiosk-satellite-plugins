name: Remove a plugin
description: Take a plugin out of Community Plugins.
title: "Remove plugin: "
labels: [removal]
body:
  - type: input
    id: repository
    attributes:
      label: Repository
      description: The GitHub repository of the listed plugin.
      placeholder: https://github.com/owner/plugin
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why it should come out. Plugin owners can leave this empty.
